
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICON BIOTRONICS | Precision Biomedical Engineering — Dubai, UAE</title>
  <meta name="description" content="Dubai's most trusted biomedical & dental equipment partner. Repair, calibration, maintenance & 24/7 emergency support for MRI, CT, Ultrasound, Dental systems across UAE.">
  <link rel="icon" type="image/png" href="images/biotronics-favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Inter:wght@300;400;500;600&family=Roboto:wght@500&display=swap" rel="stylesheet" />

  <style>
    /* ── VARIABLES ── */
    :root {
      --bg-deep:     #02040a;
      --bg-navy:     #0a1a2f;
      --silver:      #c0c0c0;
      --silver-soft: #d8d8d8;
      --white:       #ffffff;
      --blue-neon:   #00a8ff;
      --cyan-glow:   #4df3ff;
      --red-alert:   #ff3b3b;
      --card-bg:     #0f2238;
      --border-soft: #1b3350;
      --shadow-soft: 0 0 30px rgba(0,168,255,0.25);
      --text-muted:  #9aa6c0;
      --ease:        cubic-bezier(0.23,1,0.32,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #07152a 0, #02040a 55%, #000000 100%);
      color: var(--silver-soft);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container {
      width: min(1200px, 100% - 3rem);
      margin: 0 auto;
    }

    section { padding: 80px 0; position: relative; overflow: hidden; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--blue-neon); border-radius: 3px; }

    /* ── ANIMATED BACKGROUND ── */
    .bg-dna {
      position: fixed; inset: 0; pointer-events: none; z-index: -2;
      background:
        radial-gradient(circle at 10% 20%, rgba(0,168,255,0.12) 0, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(77,243,255,0.12) 0, transparent 45%);
      opacity: 0.7;
    }

    .particle {
      position: fixed; width: 3px; height: 3px; border-radius: 50%;
      background: rgba(77,243,255,0.7);
      box-shadow: 0 0 10px rgba(77,243,255,0.9);
      animation: floatParticle 18s linear infinite;
      pointer-events: none; z-index: -1;
    }
    .particle:nth-child(2) { left: 10%; animation-duration: 22s; animation-delay: -4s; }
    .particle:nth-child(3) { left: 30%; animation-duration: 26s; animation-delay: -8s; }
    .particle:nth-child(4) { left: 55%; animation-duration: 20s; animation-delay: -2s; }
    .particle:nth-child(5) { left: 75%; animation-duration: 24s; animation-delay: -6s; }
    .particle:nth-child(6) { left: 90%; animation-duration: 28s; animation-delay: -10s; }

    @keyframes floatParticle {
      0%   { transform: translateY(100vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh); opacity: 0; }
    }

    /* ── HEADER / NAV ── */
    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(2,4,10,0.97), rgba(2,4,10,0.8));
      border-bottom: 1px solid rgba(0,168,255,0.25);
      transition: box-shadow 0.3s;
    }
    header.scrolled { box-shadow: 0 4px 30px rgba(0,0,0,0.6); }

    .nav {
      display: flex; align-items: center;
      justify-content: space-between; padding: 10px 0;
      gap: 0; flex-wrap: nowrap;
    }

    .nav-left { display: flex; align-items: center; flex-shrink: 0; }

    .nav-logo { display: flex; align-items: center; }
    .nav-logo img {
      height: 42px; width: auto;
      border-radius: 4px;
      filter: drop-shadow(0 2px 10px rgba(0,168,255,0.4));
    }

    /* center links take all remaining space */
    .nav-links {
      display: flex; align-items: center;
      gap: 0; /* we use padding on each link instead */
      font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: #9aa6c0;
      flex: 1; justify-content: center;
    }

    .nav-links a {
      position: relative; padding: 6px 14px;
      transition: color 0.2s; white-space: nowrap;
    }
    .nav-links a:hover { color: var(--silver-soft); }
    .nav-links a::after {
      content: ''; position: absolute; left: 14px; right: 14px; bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--blue-neon), var(--cyan-glow));
      transform: scaleX(0); transform-origin: center;
      transition: transform 0.25s ease-out;
    }
    .nav-links a:hover::after { transform: scaleX(1); }

   .nav-cta {
      display: flex; align-items: center; gap: 5px;
      flex-shrink: 0;
    }
    
    .nav-hotline {
      font-size: 0.68rem; text-align: right; color: #ffb3b3;
      white-space: nowrap; line-height: 1.3;
    }
    .nav-hotline span { display: block; font-weight: 600; font-size: 0.75rem; color: #ffe1e1; }

    /* Hamburger */
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 6px;
    }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--silver-soft); border-radius: 2px; transition: all .3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-nav {
      display: none; flex-direction: column; gap: 0;
      background: rgba(2,4,10,0.98); border-bottom: 1px solid rgba(0,168,255,0.25);
      padding: 1rem 1.5rem;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      color: #9aa6c0; padding: 0.75rem 0; font-size: 0.9rem;
      text-transform: uppercase; letter-spacing: 0.12em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .mobile-nav a:hover { color: var(--cyan-glow); }

    /* ── BUTTONS ── */
   
    /* ── HERO ── */
    .hero { padding-top: 90px; padding-bottom: 80px; }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0,1.4fr) minmax(0,1.1fr);
      gap: 60px; align-items: center;
    }

    .eyebrow {
      font-size: 0.8rem; letter-spacing: 0.26em;
      text-transform: uppercase; color: #7f8ca3; margin-bottom: 12px;
    }

    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.4rem, 3.2vw, 3.1rem);
      line-height: 1.15; margin-bottom: 18px;
      background: linear-gradient(120deg, #f5f5f5, #c0c0c0, #f5f5f5);
      -webkit-background-clip: text; color: transparent;
    }

    .hero-highlight {
      background: linear-gradient(120deg, var(--blue-neon), var(--cyan-glow));
      -webkit-background-clip: text; color: transparent;
    }

    .hero-sub {
      font-size: 0.98rem; color: #a9b5cc;
      max-width: 520px; margin-bottom: 26px; line-height: 1.75;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }

    .hero-meta { display: flex; flex-wrap: wrap; gap: 24px; font-size: 0.8rem; color: #7f8ca3; }
    .hero-meta strong { color: var(--silver-soft); font-weight: 500; }

    /* Hero right visual */
    .hero-right { position: relative; min-height: 340px; }

    .hero-orbit {
      position: absolute; inset: 0; border-radius: 32px;
      background:
        radial-gradient(circle at top, rgba(0,168,255,0.18), rgba(2,4,10,0.95)),
        url('images/hero-lab.jpg') center/cover no-repeat;
      border: 1px solid rgba(0,168,255,0.35);
      box-shadow: var(--shadow-soft); overflow: hidden;
    }

    .hero-orbit::before {
      content: '';
      position: absolute; width: 220%; height: 220%; top: -60%; left: -60%;
      background:
        radial-gradient(circle at 20% 20%, rgba(77,243,255,0.18) 0, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0,168,255,0.22) 0, transparent 45%);
      animation: orbitGlow 26s linear infinite;
      opacity: 0.9; mix-blend-mode: screen;
    }

    @keyframes orbitGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .hero-dna {
      position: absolute; inset: 12%; border-radius: 24px;
      border: 1px solid rgba(0,168,255,0.35);
      background:
        linear-gradient(135deg, rgba(2,4,10,0.9), rgba(10,26,47,0.95)),
        repeating-linear-gradient(135deg, rgba(0,168,255,0.08) 0, rgba(0,168,255,0.08) 1px, transparent 1px, transparent 6px);
      overflow: hidden;
    }
    .hero-dna::before {
      content: ''; position: absolute;
      width: 2px; height: 220%; left: 50%; top: -10%;
      background: linear-gradient(180deg, transparent, var(--cyan-glow), transparent);
      box-shadow: 0 0 18px rgba(77,243,255,0.9);
      animation: dnaPulse 4.5s ease-in-out infinite;
    }
    .hero-dna::after {
      content: ''; position: absolute; inset: 18%;
      border-radius: 50%; border: 1px dashed rgba(0,168,255,0.4);
      box-shadow: 0 0 18px rgba(0,168,255,0.4);
      animation: rotateRing 18s linear infinite;
    }
    @keyframes dnaPulse {
      0%,100% { transform: translateX(-50%) scaleY(1); opacity: 0.4; }
      50%      { transform: translateX(-50%) scaleY(1.1); opacity: 1; }
    }
    @keyframes rotateRing {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .hero-chip {
      position: absolute; right: 10%; top: 12%;
      padding: 10px 14px; border-radius: 14px;
      background: rgba(2,4,10,0.9); border: 1px solid rgba(0,168,255,0.5);
      box-shadow: 0 0 16px rgba(0,168,255,0.6);
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.16em; color: #cdefff;
    }
    .hero-chip span { display: block; font-size: 0.65rem; color: #7f8ca3; margin-top: 4px; }

    .hero-stats {
      position: absolute; left: 8%; bottom: 10%;
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 10px; font-size: 0.75rem;
    }
    .hero-stat-card {
      padding: 10px 12px; border-radius: 12px;
      background: rgba(2,4,10,0.9); border: 1px solid rgba(0,168,255,0.35);
      color: #a9b5cc;
    }
    .hero-stat-card strong { display: block; font-size: 1rem; color: var(--silver-soft); }

    /* ── SECTION TITLES ── */
    .section-eyebrow {
      font-size: 0.78rem; letter-spacing: 0.26em;
      text-transform: uppercase; color: #7f8ca3; margin-bottom: 10px;
    }
    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.4rem, 2.5vw, 1.9rem);
      color: var(--silver-soft); margin-bottom: 8px;
    }
    .section-sub {
      font-size: 0.95rem; color: var(--text-muted);
      max-width: 720px; margin-bottom: 36px; line-height: 1.75;
    }

    /* ── STATS BAR ── */
    .stats-bar {
      background: linear-gradient(135deg, rgba(0,168,255,0.08), rgba(2,4,10,1));
      border-top: 1px solid rgba(0,168,255,0.25);
      border-bottom: 1px solid rgba(0,168,255,0.25);
      padding: 36px 0;
    }
    .stats-inner {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 2rem; text-align: center;
    }
    .stat-item { position: relative; }
    .stat-item:not(:last-child)::after {
      content: ''; position: absolute; right: 0; top: 10%; bottom: 10%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(0,168,255,0.3), transparent);
    }
    .stat-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.6rem; font-weight: 800;
      background: linear-gradient(135deg, var(--blue-neon), var(--cyan-glow));
      -webkit-background-clip: text; color: transparent; line-height: 1;
    }
    .stat-label {
      color: #7f8ca3; font-size: 0.78rem;
      margin-top: 0.4rem; text-transform: uppercase; letter-spacing: 1px;
    }

    /* ── OEM BRANDS ── */
    .brands {
      background: radial-gradient(circle at top, rgba(0,168,255,0.08), rgba(2,4,10,1));
      border-top: 1px solid rgba(0,168,255,0.2);
      border-bottom: 1px solid rgba(0,168,255,0.2);
      padding: 50px 0; overflow: hidden;
    }
    .brands-marquee { overflow: hidden; }
    .brands-row {
      display: flex; gap: 14px; width: max-content;
      animation: marqueeScroll 30s linear infinite;
    }
    .brands-row:hover { animation-play-state: paused; }
    @keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .brand-pill {
      padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(0,168,255,0.35);
      background: rgba(2,4,10,0.9); color: var(--silver-soft);
      box-shadow: 0 0 12px rgba(0,168,255,0.18);
      font-size: 0.8rem; white-space: nowrap;
      transition: all 0.3s;
    }
    .brand-pill:hover { border-color: var(--cyan-glow); color: var(--cyan-glow); }

    /* ── CARDS ── */
    .grid-3 { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 22px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 18px; }

    .card {
      background: radial-gradient(circle at top, rgba(0,168,255,0.1), var(--card-bg));
      border-radius: 18px; border: 1px solid var(--border-soft);
      padding: 22px 20px; position: relative; overflow: hidden;
      transition: all 0.3s var(--ease);
    }
    .card::before {
      content: ''; position: absolute; inset: -40%;
      background: radial-gradient(circle at top, rgba(0,168,255,0.18), transparent 55%);
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      transform: translateY(10%);
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 0 28px rgba(0,168,255,0.35); border-color: rgba(0,168,255,0.7); }
    .card:hover::before { opacity: 1; transform: translateY(0); }

    .card-icon {
      width: 36px; height: 36px; border-radius: 12px;
      background: radial-gradient(circle at top, var(--cyan-glow), var(--blue-neon));
      display: flex; align-items: center; justify-content: center;
      color: #02040a; font-size: 1.2rem; margin-bottom: 14px;
      box-shadow: 0 0 16px rgba(0,168,255,0.7); position: relative; z-index: 1;
    }
    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem; color: var(--silver-soft);
      margin-bottom: 6px; position: relative; z-index: 1;
    }
    .card-body { font-size: 0.9rem; color: #a9b5cc; margin-bottom: 10px; line-height: 1.65; position: relative; z-index: 1; }
    .card-link { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--cyan-glow); position: relative; z-index: 1; transition: gap 0.2s; }
    .card-link:hover { color: var(--white); }

    /* ── SPLIT ABOUT ── */
    .split {
      display: grid;
      grid-template-columns: minmax(0,1.1fr) minmax(0,1.1fr);
      gap: 40px; align-items: center;
    }

    .about-panel {
      border-radius: 22px; border: 1px solid var(--border-soft);
      background: radial-gradient(circle at top, rgba(0,168,255,0.12), var(--card-bg));
      padding: 24px 22px; position: relative; overflow: hidden;
    }
    .about-panel::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 0, rgba(77,243,255,0.18), transparent 55%);
      opacity: 0.7;
    }
    .about-panel-inner { position: relative; z-index: 1; }

    .about-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(2,4,10,0.85); border: 1px solid rgba(0,168,255,0.5);
      font-size: 0.75rem; color: #cdefff; margin-bottom: 12px;
    }
    .about-badge span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--cyan-glow); box-shadow: 0 0 10px rgba(77,243,255,0.9);
      animation: pulseDot 2s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.5); }
    }

    .about-list {
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px; margin-top: 14px; font-size: 0.85rem; color: #c0cadf;
    }
    .about-item strong { display: block; color: var(--silver-soft); font-size: 0.9rem; margin-bottom: 2px; }

    /* ── CORE AREAS ── */
    .core-areas {
      background: radial-gradient(circle at top, rgba(0,168,255,0.1), rgba(2,4,10,1));
      border-top: 1px solid rgba(0,168,255,0.2);
      border-bottom: 1px solid rgba(0,168,255,0.2);
    }

    .core-icon {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(0,168,255,0.6);
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan-glow); margin-bottom: 12px;
      box-shadow: 0 0 18px rgba(0,168,255,0.7);
      animation: corePulse 4s ease-in-out infinite;
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
      font-weight: 600;
    }
    @keyframes corePulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 18px rgba(0,168,255,0.7); }
      50%      { transform: scale(1.06); box-shadow: 0 0 26px rgba(0,168,255,0.9); }
    }

    /* ── TESTIMONIALS ── */
    .testimonials {
      background: radial-gradient(circle at top, rgba(0,168,255,0.1), rgba(2,4,10,1));
      border-top: 1px solid rgba(0,168,255,0.2);
      border-bottom: 1px solid rgba(0,168,255,0.2);
    }

    .testimonial-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 22px; }

    .testimonial-card {
      border-radius: 18px; border: 1px solid var(--border-soft);
      background: radial-gradient(circle at top, rgba(0,168,255,0.1), var(--card-bg));
      padding: 20px 18px; position: relative; overflow: hidden;
      transition: all 0.3s var(--ease);
    }
    .testimonial-card:hover { transform: translateY(-4px); border-color: rgba(0,168,255,0.5); }

    .testimonial-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .testimonial-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      overflow: hidden; border: 1px solid rgba(0,168,255,0.6);
      box-shadow: 0 0 12px rgba(0,168,255,0.5);
      background: var(--card-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .testimonial-name { font-size: 0.9rem; color: var(--silver-soft); font-weight: 600; }
    .testimonial-role { font-size: 0.78rem; color: #9aa6c0; }
    .testimonial-stars { font-size: 0.9rem; color: #ffd66b; margin-bottom: 8px; letter-spacing: 2px; }
    .testimonial-text { font-size: 0.88rem; color: #c0cadf; font-style: italic; line-height: 1.75; }

    /* ── FAQ ── */
    .faq-grid {
      display: grid;
      grid-template-columns: minmax(0,1.2fr) minmax(0,1fr);
      gap: 40px; align-items: flex-start;
    }

    .faq-item {
      border-radius: 16px; border: 1px solid var(--border-soft);
      background: rgba(2,4,10,0.9); margin-bottom: 10px; overflow: hidden;
      transition: border-color 0.3s;
    }
    .faq-item.open { border-color: rgba(0,168,255,0.5); }

    .faq-question {
      padding: 14px 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.9rem; color: var(--silver-soft); gap: 10px;
    }
    .faq-question:hover { color: var(--cyan-glow); }
    .faq-icon {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan-glow); font-size: 1.1rem; flex-shrink: 0;
      transition: all 0.3s;
    }
    .faq-item.open .faq-icon {
      transform: rotate(45deg);
      border-color: var(--cyan-glow);
      background: rgba(0,168,255,0.1);
    }
    .faq-answer {
      max-height: 0; overflow: hidden; padding: 0 16px;
      font-size: 0.85rem; color: #a9b5cc; line-height: 1.75;
      transition: max-height 0.35s var(--ease), padding-bottom 0.3s;
    }
    .faq-item.open .faq-answer { max-height: 300px; padding-bottom: 16px; }

    /* ── EMERGENCY ── */
    .emergency {
      background: radial-gradient(circle at top, rgba(255,59,59,0.18), rgba(2,4,10,1));
      border-top: 1px solid rgba(255,59,59,0.4);
      border-bottom: 1px solid rgba(255,59,59,0.4);
      position: relative;
    }
    .emergency::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(135deg, rgba(255,59,59,0.06) 0, rgba(255,59,59,0.06) 2px, transparent 2px, transparent 10px);
      opacity: 0.5; animation: alertScan 6s linear infinite;
    }
    @keyframes alertScan {
      0%   { transform: translateX(-10%); }
      100% { transform: translateX(10%); }
    }

    .emergency-inner {
      position: relative; z-index: 1;
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between; gap: 20px;
    }
    .emergency-text { max-width: 520px; }
    .emergency-title { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; color: #ffe1e1; margin-bottom: 6px; }
    .emergency-sub { font-size: 0.9rem; color: #ffb3b3; line-height: 1.7; }
    .emergency-phone {
      font-size: 1.2rem; font-weight: 700; color: #ffffff;
      margin-top: 10px; display: flex; align-items: center; gap: 8px;
    }
    .emergency-btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── CONTACT ── */
    #contact .about-panel { max-width: 100%; }

    .cf-form {
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px; font-size: 0.85rem; margin-top: 14px;
    }
    .cf-form input, .cf-form textarea, .cf-form select {
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: rgba(2,4,10,0.9); color: var(--silver-soft);
      font-family: 'Inter', sans-serif; font-size: 0.85rem;
      transition: border-color 0.3s;
    }
    .cf-form input:focus, .cf-form textarea:focus, .cf-form select:focus {
      outline: none; border-color: var(--blue-neon);
      box-shadow: 0 0 0 3px rgba(0,168,255,0.12);
    }
    .cf-form select option { background: var(--bg-navy); }
    .cf-form textarea { resize: vertical; min-height: 90px; grid-column: 1/-1; }
    .cf-form .full { grid-column: 1/-1; }
    ::placeholder { color: #4a5568; }

    /* ── FOOTER ── */
    footer {
      background: #020409;
      border-top: 1px solid rgba(0,168,255,0.2);
      padding: 50px 0 24px; font-size: 0.8rem; color: #7f8ca3;
    }
    .footer-grid {
      display: grid; grid-template-columns: repeat(4,minmax(0,1fr));
      gap: 26px; margin-bottom: 28px;
    }
    .footer-title { font-family: 'Montserrat', sans-serif; font-size: 0.9rem; color: var(--silver-soft); margin-bottom: 12px; }
    .footer-link { display: block; margin-bottom: 6px; color: #9aa6c0; transition: color 0.2s; }
    .footer-link:hover { color: var(--cyan-glow); }
    a.footer-link:hover { color: var(--cyan-glow); }
    .footer-logo { margin-bottom: 12px; }
    .footer-logo img { height: 52px; width: auto; opacity: 0.92; border-radius: 4px; filter: drop-shadow(0 2px 10px rgba(0,168,255,0.35)); }
    .footer-desc { font-size: 0.82rem; color: #7f8ca3; line-height: 1.7; margin-bottom: 14px; }
    .footer-certs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .fcb {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      padding: 3px 8px; border-radius: 20px;
      background: rgba(0,168,255,0.1); color: var(--cyan-glow); border: 1px solid rgba(0,168,255,0.25);
    }
    .footer-bottom {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.06); padding-top: 14px; font-size: 0.75rem;
    }

    /* ── FLOATING WHATSAPP ── */
    .wa-float {
      position: fixed; bottom: 2rem; right: 2rem;
      width: 56px; height: 56px; background: #25D366;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(37,211,102,0.5); z-index: 900; transition: all 0.3s;
    }
    .wa-float:hover { transform: scale(1.1); box-shadow: 0 6px 32px rgba(37,211,102,0.7); }
    .wa-float svg { width: 28px; height: 28px; fill: white; }

    /* ── SCROLL REVEAL ── */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.65s var(--ease), transform 0.65s var(--ease); }
    .reveal.visible { opacity: 1; transform: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 960px) {
      .hero-grid, .split, .faq-grid, .grid-3, .testimonial-grid, .footer-grid {
        grid-template-columns: minmax(0,1fr);
      }
      .grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .hero-right { order: -1; margin-bottom: 26px; }
      .stats-inner { grid-template-columns: repeat(2,1fr); }
      .stat-item::after { display: none; }
      .nav-links { display: none; }
      .nav-cta { display: none; }
      .hamburger { display: flex; }
    }

    @media (max-width: 600px) {
      section { padding: 60px 0; }
      .hero { padding-top: 80px; }
      .hero-title { font-size: 2rem; }
      .grid-4 { grid-template-columns: 1fr; }
      .stats-inner { grid-template-columns: repeat(2,1fr); gap: 1rem; }
      .cf-form { grid-template-columns: 1fr; }
      .cf-form .full { grid-column: 1; }
    }
  </style>
</head>
